<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>동상이몽 · 실시간 공유</title><link rel="stylesheet" href="/app.css"><style>body{display:block;background:#f5f7fb}.live-wrap{max-width:1440px;margin:auto;padding:24px}.live-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.live-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;margin-top:24px}.live-card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:24px;min-width:0}.live-turn{border-top:1px solid #eef2f6;padding:18px 0;scroll-margin-top:20px}.live-turn p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}.meta{color:#64748b;font-size:13px}.question{padding:18px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;line-height:1.8}button,input{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:8px}input{width:100%;box-sizing:border-box}a{color:#2563eb}.live-note{color:#64748b;font-size:13px;line-height:1.7}h1{font-size:25px}@media(max-width:760px){.live-grid{grid-template-columns:1fr}.live-wrap{padding:16px}.live-card{padding:18px}}</style></head><body><main class="live-wrap"><header class="live-head"><div><a href="/">동상이몽</a><h1>함께 보는 회의</h1></div><button id="copy">공유 링크 복사</button></header><p id="connection" role="status">회의를 불러오는 중입니다.</p><section class="live-card"><span class="meta">오늘의 회의 목적</span><h2 id="goal"></h2><p class="live-note">진행자가 마이크로 수집한 전사와 검토를 3초마다 갱신합니다. 읽기 전용이며 링크를 받은 누구나 볼 수 있습니다.</p></section><div class="live-grid"><section class="live-card"><h2>회의 원문 <span id="count" class="meta"></span></h2><input id="search" aria-label="회의 원문 검색" placeholder="발언 검색"><div id="turns"></div></section><section class="live-card"><h2>회의 진행 보조</h2><p id="period" class="meta"></p><div id="reviews"></div></section></div></main><script src="/live.js"></script></body></html>
