services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    volumes:
      - meeting-data:/app/.data
    expose:
      - "3210"
  https:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  meeting-data:
  caddy-data:
  caddy-config:
