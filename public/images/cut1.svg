<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- 성벽 silhoutte -->
  <path d="M 0 350 L 150 350 L 150 300 L 220 300 L 220 350 L 380 350 L 380 270 L 480 270 L 480 350 L 800 350 L 800 450 L 0 450 Z" fill="#090d16"/>
  <!-- 붉은 달 -->
  <circle cx="650" cy="140" r="70" fill="#991b1b" opacity="0.6"/>
  <!-- 붉은 만장 깃발 -->
  <path d="M 400 270 C 450 240, 520 280, 600 230 L 590 310 C 510 340, 440 290, 400 320 Z" fill="url(#redGlow)" opacity="0.95"/>
  <line x1="400" y1="180" x2="400" y2="360" stroke="#d97706" stroke-width="6"/>
  <!-- 텍스트 라벨 -->
  <text x="40" y="70" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="1">SCENE 01: 서막 (고려의 밤)</text>
  <text x="40" y="105" font-family="-apple-system, sans-serif" font-size="16" fill="#94a3b8">혼란의 시대, 성벽 위로 붉은 만장이 스며든다</text>
</svg>
