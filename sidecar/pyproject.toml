[project]
name = "audio-sidecar"
version = "0.1.0"
description = "SceneNote local audio sidecar: Silero VAD, speaker embeddings, cross-chunk speaker linking, baseline diarization, DER/JER, SigLIP 2 image similarity"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "torch>=2.4",
  "torchaudio>=2.4",
  "silero-vad>=5.1",
  "speechbrain>=1.0",
  "pyannote.metrics>=3.2",
  "transformers>=4.50",
  "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
